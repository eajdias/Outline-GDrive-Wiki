# Overlay de produção: limites mais altos, sem portas de acesso direto,
# TLS no edge. Uso:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Pré-requisitos no host: ./certs/fullchain.pem + ./certs/privkey.pem,
# .env.production (ou .env) com segredos reais.

services:
  outline:
    ports: !override [] # sem acesso direto; só via edge
    environment:
      URL: ${OUTLINE_PUBLIC_URL:?OUTLINE_PUBLIC_URL ausente}
      FORCE_HTTPS: "true"

  uploads:
    ports: !override [] # anexos só via edge/wiki

  edge:
    # !override é obrigatório: o merge padrão do Compose soma listas, então
    # herdaria a porta de dev e publicaria 127.0.0.1:8091 em produção.
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - ./edge/routes.conf:/usr/local/openresty/nginx/conf/routes.conf:ro
      - ./edge/nginx.tls.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
