# Overlay VPS compartilhada (ex.: host com nginx próprio em 80/443).
# Uso:
#   DEPLOY_ENV=vps ./src/infra/deploy.sh
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
#
# Diferença para o prod dedicado (docker-compose.prod.yml): aqui o edge
# continua em 127.0.0.1:8091 sem TLS — o TLS termina no reverse proxy do
# host (ver host-nginx/wiki.conf.example). Só remove as portas de acesso
# direto, que colidiriam com outros serviços do host.

services:
  outline:
    ports: !override [] # sem acesso direto; só via edge
    environment:
      URL: ${OUTLINE_PUBLIC_URL:?OUTLINE_PUBLIC_URL ausente}
      # true atrás do host com TLS (fase domínio); false no teste HTTP via tailnet
      FORCE_HTTPS: "${FORCE_HTTPS:-true}"

  uploads:
    ports: !override [] # anexos só via edge/wiki
