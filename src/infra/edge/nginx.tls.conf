# edge em produção: TLS em 443 + redirect 80→443 e HSTS.
# Os certificados vêm de ./certs (montado read-only pelo compose de produção);
# o deploy valida a existência antes de subir, então o nginx falha cedo se faltar.
#
# Rotas idênticas ao modo dev: ficam em routes.conf, incluído nos dois servers.

env CHAT_PUBLIC_URL;

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 256;
}

http {
  access_log /dev/stdout combined;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  proxy_buffering off;
  server_tokens off;

  # read-only fs + tmpfs em /tmp: os temp paths default do openresty
  # (/usr/local/openresty/nginx/*_temp) não são graváveis.
  client_body_temp_path /tmp/nginx_client_body;
  proxy_temp_path /tmp/nginx_proxy;
  fastcgi_temp_path /tmp/nginx_fastcgi;
  uwsgi_temp_path /tmp/nginx_uwsgi;
  scgi_temp_path /tmp/nginx_scgi;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:edge_tls:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  server {
    listen 80;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 'ok';
    }

    location / {
      return 308 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    include /usr/local/openresty/nginx/conf/routes.conf;
  }
}
