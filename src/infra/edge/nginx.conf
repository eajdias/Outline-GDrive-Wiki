# edge: proxy único (openresty) — wiki com injeção do snippet + app do chat.
#
# - `/` → outline:3000, com <script widget.js> injetado antes de </body>
#   (CHAT_PUBLIC_URL) e script-src do CSP estendido com a origem do chat
#   (nonce preservado; trocar o CSP inteiro quebraria o wiki);
# - `/chat/` → chatui:8080 (UI + /ask + assets), limite de corpo 8 KB;
# - websocket repassado (realtime do Outline).

env CHAT_PUBLIC_URL;

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 128;
}

http {
  access_log /dev/stdout combined;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    listen 80;

    # DNS interno do Docker: resolve o importador em tempo de request, para o
    # edge não falhar no boot quando o serviço ainda não subiu.
    resolver 127.0.0.11 valid=10s ipv6=off;

    set_by_lua_block $chat_url {
      return os.getenv("CHAT_PUBLIC_URL");
    }

    set $import_drive_upstream http://import-drive:8787;

    # Healthcheck do compose (único bypass de auth/TLS).
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 'ok';
    }

    # Limpa cache/storage do navegador (inclui service worker) e volta ao wiki.
    # Não limpa cookies: o login (accessToken) permanece. Uso local/homolog.
    location = /reset {
      add_header Clear-Site-Data '"cache", "storage"' always;
      add_header Cache-Control "no-store" always;
      default_type text/html;
      return 200 '<!doctype html><meta http-equiv="refresh" content="0;url=/">';
    }

    # Streaming de imagens inline dos Docs (import-drive -> Docs API -> browser).
    # Não armazena binário; o cache é em memória no importador.
    location /drive-image/ {
      proxy_pass $import_drive_upstream$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # Push notification do Google Drive (produção: HTTPS público).
    # O importador responde 202 na hora e agenda o apply.
    location = /hooks/drive {
      proxy_pass $import_drive_upstream$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 8k;
    }

    location = /chat {
      return 301 /chat/;
    }

    location /chat/ {
      proxy_pass http://chatui:8080/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      client_max_body_size 8k;
    }

    location / {
      proxy_pass http://outline:3000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Accept-Encoding "";

      sub_filter '</body>' '<script src="$chat_url/widget.js" data-chat-src="$chat_url" defer></script></body>';
      sub_filter_once on;

      header_filter_by_lua_block {
        local csp = ngx.header["Content-Security-Policy"];
        local chat = os.getenv("CHAT_PUBLIC_URL");
        if csp and chat then
          ngx.header["Content-Security-Policy"] = string.gsub(csp, "script%-src", "script-src " .. chat, 1);
        end
      }
    }
  }
}
