# edge em desenvolvimento/homologação: HTTP puro em 127.0.0.1:8091.
# Produção usa nginx.tls.conf (TLS + redirect 80→443).
#
# - `/` → outline:3000, com <script widget.js> injetado antes de </body>
#   (CHAT_PUBLIC_URL) e script-src do CSP estendido com a origem do chat
#   (nonce preservado; trocar o CSP inteiro quebraria o wiki);
# - `/chat/` → chat:8080 (UI + /ask + assets), limite de corpo 8 KB;
# - `/hooks/drive` e `/drive-image/` → importer;
# - websocket repassado (realtime do Outline).
# As rotas em si vivem em routes.conf, compartilhado com o modo TLS.

env CHAT_PUBLIC_URL;

worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 128;
}

http {
  access_log /dev/stdout combined;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  proxy_buffering off;
  server_tokens off;

  # read-only fs + tmpfs em /tmp: os temp paths default do openresty
  # (/usr/local/openresty/nginx/*_temp) não são graváveis.
  client_body_temp_path /tmp/nginx_client_body;
  proxy_temp_path /tmp/nginx_proxy;
  fastcgi_temp_path /tmp/nginx_fastcgi;
  uwsgi_temp_path /tmp/nginx_uwsgi;
  scgi_temp_path /tmp/nginx_scgi;

  server {
    listen 80;

    include /usr/local/openresty/nginx/conf/routes.conf;
  }
}
