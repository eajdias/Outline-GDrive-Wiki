# Rotas compartilhadas do edge (contexto `server`).
# Incluído por nginx.conf (dev, HTTP) e nginx.tls.conf (produção, TLS).
# Nunca duplique location aqui e no arquivo que inclui.

# DNS interno do Docker: resolve os upstreams em tempo de request, para o
# edge não falhar no boot quando o serviço ainda não subiu.
resolver 127.0.0.11 valid=10s ipv6=off;

set_by_lua_block $chat_url {
  return os.getenv("CHAT_PUBLIC_URL");
}

set $importer_upstream http://importer:8787;

# Healthcheck do compose (único bypass de auth/TLS). Responde nos dois
# listeners antes de qualquer redirect, senão o health-gate do deploy falha.
location = /healthz {
  access_log off;
  default_type text/plain;
  return 200 'ok';
}

# Limpa cache/storage do navegador (inclui service worker) e volta ao wiki.
# Não limpa cookies: o login (accessToken) permanece. Uso local/homolog.
location = /reset {
  add_header Clear-Site-Data '"cache", "storage"' always;
  add_header Cache-Control "no-store" always;
  default_type text/html;
  return 200 '<!doctype html><meta http-equiv="refresh" content="0;url=/">';
}

# Streaming de imagens inline dos Docs (importer -> Docs API -> browser).
# Não armazena binário; o cache é em memória no importer.
location /drive-image/ {
  proxy_pass $importer_upstream$request_uri;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;
}

# Push notification do Google Drive (produção: HTTPS público).
# O importador responde 202 na hora e agenda o apply.
location = /hooks/drive {
  proxy_pass $importer_upstream$request_uri;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  client_max_body_size 8k;
}

location = /chat {
  return 301 /chat/;
}

location /chat/ {
  proxy_pass http://chat:8080/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  client_max_body_size 8k;
}

location / {
  proxy_pass http://outline:3000;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Accept-Encoding "";

  sub_filter '</body>' '<script src="$chat_url/widget.js" data-chat-src="$chat_url" defer></script></body>';
  sub_filter_once on;

  header_filter_by_lua_block {
    local csp = ngx.header["Content-Security-Policy"];
    local chat = os.getenv("CHAT_PUBLIC_URL");
    if csp and chat then
      ngx.header["Content-Security-Policy"] = string.gsub(csp, "script%-src", "script-src " .. chat, 1);
    end
  }
}
