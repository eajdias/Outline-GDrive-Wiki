# Stack outline-gdrive-wiki. Rodar sempre da raiz do repo:
#   docker compose -f src/infra/docker-compose.yml <comando>
# Project directory = src/infra/ : env_file ".env" resolve para src/infra/.env
# e o mount ../content/raw/uploads resolve para src/content/raw/uploads.
#
# Base dev (esta arquivo) + overlay de produção (docker-compose.prod.yml):
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

name: outline-gdrive-wiki

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-outline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ausente no src/infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-outline}
    volumes:
      - pgdata:/var/lib/postgresql # PG18+: mount no parent (entrypoint recusa mount direto em .../data; dados vão p/ subdir versionado)
    networks:
      - back
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-outline} -d $${POSTGRES_DB:-outline}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *logging
    mem_limit: 1g
    cpus: 1.0

  redis:
    image: redis:8.6-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - back
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *logging
    mem_limit: 512m
    cpus: 0.5

  outline:
    image: outlinewiki/outline:1.13.0
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    ports:
      - "127.0.0.1:${OUTLINE_DIRECT_PORT:-3000}:3000" # loopback: não rouba 0.0.0.0:3000 em host compartilhado
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-outline}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ausente no src/infra/.env}@postgres:5432/${POSTGRES_DB:-outline}
    volumes:
      - outlinedata:/var/lib/outline/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - front
      - back
    logging: *logging
    mem_limit: 1g
    cpus: 1.0
    read_only: false # Outline escreve uploads no volume próprio
    tmpfs:
      - /tmp

  uploads:
    image: nginx:1.29-alpine
    restart: unless-stopped
    expose:
      - "80"
    ports:
      - "127.0.0.1:${UPLOADS_DIRECT_PORT:-8080}:80" # loopback: não rouba 0.0.0.0:8080 em host compartilhado
    volumes:
      - ../content/raw/uploads:/usr/share/nginx/html:ro
    networks:
      - front
    healthcheck:
      # O dir montado pode estar vazio e sem index (403/404). O que importa
      # é o nginx responder HTTP (busybox wget retorna 1 tanto para erro
      # HTTP quanto para falha de rede — por isso o grep no status).
      test: ["CMD-SHELL", "out=$$(wget -S --spider http://127.0.0.1:80/ 2>&1); echo \"$$out\" | grep -qE 'HTTP/[0-9.]+ [234][0-9][0-9]'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging
    mem_limit: 128m
    cpus: 0.25
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /run

  anythingllm:
    image: mintplexlabs/anythingllm:1.20.0
    restart: unless-stopped
    environment:
      STORAGE_DIR: /app/server/storage
      SERVER_PORT: "3001"
      LLM_PROVIDER: ${LLM_PROVIDER:-generic-openai}
      GENERIC_OPEN_AI_BASE_PATH: http://llm-gateway:8090/v1
      GENERIC_OPEN_AI_MODEL_PREF: ${GEMINI_LLM_MODEL_PREF:-gemini-2.5-flash-lite}
      GENERIC_OPEN_AI_API_KEY: ${LLM_GATEWAY_TOKEN:-none}
      GENERIC_OPEN_AI_MODEL_TOKEN_LIMIT: ${GENERIC_OPEN_AI_MODEL_TOKEN_LIMIT:-8192}
      EMBEDDING_ENGINE: ${EMBEDDING_ENGINE:-generic-openai}
      EMBEDDING_BASE_PATH: http://llm-gateway:8090/v1
      GENERIC_OPEN_AI_EMBEDDING_API_KEY: ${LLM_GATEWAY_TOKEN:-none}
      EMBEDDING_MODEL_PREF: ${EMBEDDING_MODEL_PREF:-gemini-embedding-001}
      EMBEDDING_OUTPUT_DIMENSIONS: ${EMBEDDING_OUTPUT_DIMENSIONS:-2048}
      VECTOR_DB: ${VECTOR_DB:-lancedb}
      JWT_SECRET: ${ANYTHINGLLM_JWT_SECRET:?ANYTHINGLLM_JWT_SECRET ausente no src/infra/.env}
      AUTH_TOKEN: ${ANYTHINGLLM_AUTH_TOKEN:?ANYTHINGLLM_AUTH_TOKEN ausente no src/infra/.env}
      DISABLE_TELEMETRY: "true"
    volumes:
      - anythingllmdata:/app/server/storage
    networks:
      - front
      - back
    depends_on:
      llm-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3001/api/ping >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging: *logging
    mem_limit: 2g
    cpus: 2.0

  # Roteador de cota: fica entre AnythingLLM e os provedores LLM.
  # Rotaciona as chaves quando uma atinge 429 e troca de provedor quando todas esgotam.
  llm-gateway:
    build:
      context: ../..
      dockerfile: apps/llm-gateway/Dockerfile
    restart: unless-stopped
    environment:
      LLM_GATEWAY_PROVIDERS: ${LLM_GATEWAY_PROVIDERS:-gemini}
      LLM_GATEWAY_TOKEN: ${LLM_GATEWAY_TOKEN:-}
      LLM_GATEWAY_EMBEDDING_DIMENSIONS: ${EMBEDDING_OUTPUT_DIMENSIONS:-2048}
      LLM_GATEWAY_KEY_COOLDOWN_MS: ${LLM_GATEWAY_KEY_COOLDOWN_MS:-900000}
      GEMINI_API_KEYS: ${GEMINI_API_KEYS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_LLM_MODEL_PREF:-}
      GEMINI_EMBEDDING_MODEL: ${EMBEDDING_MODEL_PREF:-}
      GENERIC_BASE_URL: ${GENERIC_BASE_URL:-}
      GENERIC_API_KEYS: ${GENERIC_API_KEYS:-}
      GENERIC_MODEL: ${GENERIC_MODEL:-}
      GENERIC_EMBEDDING_MODEL: ${GENERIC_EMBEDDING_MODEL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - back
    logging: *logging
    mem_limit: 256m
    cpus: 0.25
    read_only: true
    tmpfs:
      - /tmp

  chat:
    build:
      context: ../..
      dockerfile: apps/chat/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      ANYTHINGLLM_API_URL: http://anythingllm:3001
      ANYTHINGLLM_API_KEY: ${ANYTHINGLLM_API_KEY:?ANYTHINGLLM_API_KEY ausente no src/infra/.env}
      ANYTHINGLLM_WORKSPACES: ${ANYTHINGLLM_WORKSPACES:-kb-drive}
      CHAT_MIN_SCORE: ${CHAT_MIN_SCORE:-0.65}
      CHAT_RATE_LIMIT_MAX: ${CHAT_RATE_LIMIT_MAX:-10}
      CHAT_RATE_LIMIT_WINDOW_MS: ${CHAT_RATE_LIMIT_WINDOW_MS:-60000}
      CHAT_MAX_QUESTION_CHARS: ${CHAT_MAX_QUESTION_CHARS:-1000}
      CHAT_BODY_LIMIT_BYTES: ${CHAT_BODY_LIMIT_BYTES:-8192}
      CHAT_TIMEOUT_MS: ${CHAT_TIMEOUT_MS:-60000}
      CHAT_ALLOW_EMBED: ${CHAT_ALLOW_EMBED:-1}
      OUTLINE_AUTH_URL: ${OUTLINE_AUTH_URL:-http://outline:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      anythingllm:
        condition: service_healthy
      outline:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - front
      - back
    logging: *logging
    mem_limit: 512m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp

  # Importador Drive: `serve` recebe push notification e renova o canal.
  # Para carga/incremental avulso: docker compose run --rm importer seed|apply|verify
  importer:
    build:
      context: ../..
      dockerfile: apps/importer/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      STATE_DATABASE_URL: postgres://${POSTGRES_USER:-outline}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ausente no src/infra/.env}@postgres:5432/${POSTGRES_DB:-outline}
      DRIVE_SA_KEY_PATH: /run/secrets/drive-sa.json
      OUTLINE_API_URL: http://outline:3000
      ANYTHINGLLM_API_URL: http://anythingllm:3001
      IMPORT_CONCURRENCY: ${IMPORT_CONCURRENCY:-4}
    volumes:
      - ${DRIVE_SA_KEY_PATH:-./secrets/drive-sa.json}:/run/secrets/drive-sa.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      outline:
        condition: service_healthy
      anythingllm:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${IMPORT_DRIVE_PORT:-8787}/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - back
    logging: *logging
    mem_limit: 512m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp

  # Edge único (openresty): wiki com injeção do snippet + app do chat em /chat/.
  edge:
    image: openresty/openresty:alpine
    restart: unless-stopped
    ports:
      - "${EDGE_BIND_IP:-127.0.0.1}:${EDGE_PORT:-8091}:80"
    environment:
      CHAT_PUBLIC_URL: ${CHAT_PUBLIC_URL:-http://127.0.0.1:8091/chat}
    volumes:
      - ./edge/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./edge/routes.conf:/usr/local/openresty/nginx/conf/routes.conf:ro
    depends_on:
      outline:
        condition: service_healthy
      chat:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - front
    logging: *logging
    mem_limit: 256m
    cpus: 0.5
    read_only: true
    tmpfs:
      - /tmp
      - /var/run

  # Backup one-shot: chamado pelo timer do host.
  #   docker compose -f src/infra/docker-compose.yml run --rm backup
  backup:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-outline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD ausente no src/infra/.env}
      POSTGRES_DB: ${POSTGRES_DB:-outline}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
    volumes:
      - pgdata:/var/lib/postgresql:ro
      - redisdata:/redis:ro
      - outlinedata:/wiki-data:ro
      - anythingllmdata:/rag-data:ro
      - ../backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    networks:
      - back
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/backup.sh"]
    profiles: ["tools"]
    deploy:
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 2
        window: 120s

networks:
  front:
    name: kb-front
  back:
    name: kb-back

volumes:
  pgdata:
  redisdata:
  outlinedata:
  anythingllmdata:
