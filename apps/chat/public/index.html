<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Base de conhecimento</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main id="chat-card" aria-label="Chat base de conhecimento">
      <header class="chat-header">
        <div class="chat-title">
          <p class="eyebrow">Wiki</p>
          <h1>Base de conhecimento</h1>
        </div>
        <span class="status-dot" aria-hidden="true"></span>
      </header>

      <section id="conversation" aria-live="polite" aria-label="Conversa">
        <div id="empty-state" class="empty-state">
          <p class="empty-title">Pergunte sobre a documentação</p>
          <p class="empty-text">As respostas citam os documentos do Drive.</p>
        </div>
      </section>

      <form id="ask-form">
        <label for="question">Sua pergunta</label>
        <div class="input-row">
          <textarea
            id="question"
            name="question"
            rows="2"
            maxlength="1000"
            required
            placeholder="Ex.: Como configurar o acesso VPN?"
          ></textarea>
          <button id="send" type="submit">Perguntar</button>
        </div>
        <p class="hint">Enter envia · Shift+Enter quebra linha</p>
      </form>
    </main>

    <button id="bubble" type="button" aria-label="Abrir conversa" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 3h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H8l-5 4V4a1 1 0 0 1 1-1z" />
      </svg>
    </button>

    <template id="turn-template">
      <article class="turn">
        <p class="question"></p>
        <div class="answer"></div>
        <div class="sources"></div>
      </article>
    </template>

    <script type="module" src="app.js"></script>
  </body>
</html>
